plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'maven-publish'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java { sourceCompatibility = JavaVersion.VERSION_17 }

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://central.sonatype.com/repository/maven-snapshots/"; mavenContent { snapshotsOnly() } }
}

dependencyManagement {
    imports {
        mavenBom "sh.stubborn:stubborn-contract-dependencies:0.2.1"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation "sh.stubborn:stubborn-contract-wiremock-spring:0.2.1"
}

tasks.named('test') {
    useJUnitPlatform()
}

// This producer has no contract plugin: its stubs are the WireMock mappings REST Docs writes
// while BeerControllerTest runs, which the Maven build packages with maven-jar-plugin under the
// `stubs` classifier. The same jar, built by hand here, and published so the consumer can
// resolve com.example:beer-api-producer-restdocs:+:stubs from the local Maven repository.
//
// The snippets path is 'target/snippets' because BeerControllerTest names it literally, so it
// is the same directory under Gradle as under Maven rather than build/.
tasks.register('stubsJar', Jar) {
    dependsOn tasks.named('test')
    archiveClassifier = 'stubs'
    from "${project.projectDir}/target/snippets/stubs"
}

publishing {
    publications {
        stubs(MavenPublication) {
            artifactId = 'beer-api-producer-restdocs'
            artifact tasks.named('stubsJar')
        }
    }
}

tasks.named('build') {
    finalizedBy 'publishToMavenLocal'
}
