plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'sh.stubborn.contract' version '0.2.1'
    id 'java'
    id 'maven-publish'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven {
        url 'https://central.sonatype.com/repository/maven-snapshots/'
        mavenContent { snapshotsOnly() }
    }
    mavenLocal()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-integration'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "sh.stubborn:stubborn-contract-starter-verifier:0.2.1"
}

contracts {
    testFramework = 'JUNIT5'
    packageWithBaseClasses = 'com.example'
    contractsDslDir = file("${project.projectDir}/src/test/resources/contracts")
}

tasks.named('test') {
    useJUnitPlatform()
}

// The consumer resolves com.example:book-api-producer-messaging:+:stubs from the local Maven
// repository (stubsMode LOCAL). `mvn install` puts the stubs JAR there for the Maven leg;
// `gradle build` installs nothing, so publish it here too. The artifactId is explicit because
// Gradle names this project after its directory, not after the artifact the contract names.
publishing {
    publications {
        stubs(MavenPublication) {
            artifactId = 'book-api-producer-messaging'
            artifact tasks.named('verifierStubsJar')
        }
    }
}

tasks.named('build') {
    finalizedBy 'publishToMavenLocal'
}
