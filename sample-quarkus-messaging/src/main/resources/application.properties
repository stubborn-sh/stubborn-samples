# Quarkus messaging consumer sample. No HTTP server is started (only quarkus-arc + messaging).
#
# The @Incoming("greetings") listener binds to the Kafka "greetings" topic through the SmallRye
# Kafka connector. Payloads arrive as JSON strings and are deserialized into GreetingEvent.
mp.messaging.incoming.greetings.connector=smallrye-kafka
mp.messaging.incoming.greetings.topic=greetings
mp.messaging.incoming.greetings.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.greetings.auto.offset.reset=earliest

# In tests no kafka.bootstrap.servers is set, so Quarkus Kafka Dev Services starts a real broker
# automatically. Pinning the Dev Services port makes the broker address deterministic, so the test
# can pass the very same "localhost:59092" to the stub runner's brokerAddress init arg (the stub
# runner publishes the triggered contract message to that broker).
quarkus.kafka.devservices.port=59092
