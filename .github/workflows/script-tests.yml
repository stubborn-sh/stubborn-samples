name: Shell Script Tests

# Syntax-checks every shell script under scripts/ and runs the BATS suite that
# covers the logic extracted out of the workflow YAMLs. Convention: workflows
# call scripts, and scripts are tested here.

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'test/bats/**'
      - '.github/workflows/script-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'scripts/**'
      - 'test/bats/**'
      - '.github/workflows/script-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bats:
    name: Shell Script BATS Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Syntax-check all scripts
        run: find scripts -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Run BATS suite
        run: bats test/bats
