name: Bump stubborn-contract version

# Pin every sample to a given stubborn-contract version and let CI verify against
# it. Fired automatically when stubborn-contract publishes a release (via a
# repository_dispatch from that repo's release workflow), or by hand.
#
# It opens an auto-merging PR: the samples CI (build every sample against the new
# version) must go green before it merges.

on:
  repository_dispatch:
    types: [stubborn-contract-released]
  workflow_dispatch:
    inputs:
      version:
        description: 'stubborn-contract version to pin (e.g. 0.1.3)'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      # RELEASE_PAT, not the default GITHUB_TOKEN, for both the push below and the PR this
      # job opens. GitHub starts no workflow runs for events created with GITHUB_TOKEN, so
      # a PR opened with it never gets CI: it sits at zero checks with mergeable_state
      # "unstable" forever, and the `gh pr merge --auto` at the end of open-bump-pr.sh can
      # never fire. That is what happened to the 0.2.2 bump PR.
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_PAT }}

      - name: Resolve target version
        id: v
        run: |
          set -euo pipefail
          VERSION="${{ github.event.client_payload.version }}"
          [ -z "$VERSION" ] && VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            echo "No version supplied (client_payload.version / inputs.version)." >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Pin samples to ${{ steps.v.outputs.version }}
        run: scripts/set-samples-version.sh "${{ steps.v.outputs.version }}"

      - name: Open auto-merging PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
        run: bash scripts/open-bump-pr.sh "${{ steps.v.outputs.version }}"
