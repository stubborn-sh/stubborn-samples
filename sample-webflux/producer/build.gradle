plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'sh.stubborn.contract' version '0.2.2'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java { sourceCompatibility = JavaVersion.VERSION_17 }

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://central.sonatype.com/repository/maven-snapshots/"; mavenContent { snapshotsOnly() } }
}

dependencyManagement {
    imports {
        mavenBom "sh.stubborn:stubborn-contract-dependencies:0.2.2"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'sh.stubborn:stubborn-contract-starter-verifier:0.2.2'
    // WEBTESTCLIENT generates tests against io.restassured.module.webtestclient. No
    // version: the BOM imported above manages every REST Assured module a generated test
    // can be compiled against (stubborn-sh/stubborn#147).
    testImplementation 'io.rest-assured:spring-web-test-client'
}

contracts {
    testFramework = 'JUNIT5'
    testMode = 'WEBTESTCLIENT'
    packageWithBaseClasses = 'com.example'
    contractsDslDir = file("${project.projectDir}/src/test/resources/contracts")
}
