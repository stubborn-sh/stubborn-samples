plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
java { sourceCompatibility = JavaVersion.VERSION_17 }

repositories {
    mavenCentral()
    mavenLocal()
    maven { url "https://central.sonatype.com/repository/maven-snapshots/"; mavenContent { snapshotsOnly() } }
}

// Aligns org.eclipse.jetty.ee10 with the Jetty core Boot manages. Boot imports jetty-bom and
// jetty-ee11-bom but not ee10, the servlet layer wiremock-jetty12 is built against; left
// unmanaged it resolves to 12.0.x under Boot's 12.1.x core and the stub server dies with
// NoSuchMethodError on Environment.ensure (stubborn-sh/stubborn#142). The Maven side of each
// sample has always imported this BOM; the Gradle side did not, and no consumer test ran to
// catch it.
dependencyManagement {
    imports {
        mavenBom "sh.stubborn:stubborn-contract-dependencies:0.2.2"
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'sh.stubborn:stubborn-contract-starter-stub-runner:0.2.2'
}

tasks.named('test') {
    useJUnitPlatform()
}
