plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'sh.stubborn.contract' version '0.2.2'
    id 'java'
    id 'maven-publish'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
    maven {
        url 'https://central.sonatype.com/repository/maven-snapshots/'
        mavenContent { snapshotsOnly() }
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation "sh.stubborn:stubborn-contract-starter-verifier:0.2.2"
}

contracts {
    testFramework = 'JUNIT5'
    packageWithBaseClasses = 'com.example'
    contractsDslDir = file("${project.projectDir}/src/test/resources/contracts")
}

tasks.named('test') {
    useJUnitPlatform()
}

// The consumer asks its stub runner for com.example:beer-api-producer:+:stubs and, with
// stubsMode LOCAL, looks for it in the local Maven repository. The Maven leg of CI runs
// `mvn clean install` on this producer, so the stubs JAR lands there; `gradle build`
// installs nothing, which is why the Gradle consumer leg could never resolve the stubs.
//
// Publishing the stubs JAR gives the Gradle leg the same starting point. The artifactId is
// stated explicitly because Gradle names this project 'producer' (it is a subproject of
// sample-http) while the contract — and the consumer — call it beer-api-producer.
publishing {
    publications {
        stubs(MavenPublication) {
            artifactId = 'beer-api-producer'
            artifact tasks.named('verifierStubsJar')
        }
    }
}

tasks.named('build') {
    finalizedBy 'publishToMavenLocal'
}
